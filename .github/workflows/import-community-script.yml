name: Import community script

on:
  discussion_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  discussions: write

concurrency:
  group: import-community-script-${{ github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  import:
    # Only maintainers can trigger an import, and only with an exact /import
    # comment in the script submission category.
    if: >
      github.event.comment.body == '/import' &&
      github.event.discussion.category.slug == 'script-submissions' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Parse submission and create PR
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_CATEGORY: ${{ github.event.discussion.category.slug }}
          DISCUSSION_AUTHOR: ${{ github.event.discussion.user.login }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/import_community_script.py

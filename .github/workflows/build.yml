name: Build and Release

on:
  push:
    branches-ignore:
      - next
    tags:
      - '*'
  pull_request:
    branches-ignore:
      - next
  workflow_dispatch:

# 创建 Release 需要写权限（否则 GITHUB_TOKEN 只能读）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: dotnet build llcom/llcom.csproj -c Release -p:Platform=x64

      - name: Run unit tests
        run: dotnet test tests/llcom.Tests/llcom.Tests.csproj -c Release -p:Platform=x64

      - name: Clean build output
        shell: cmd
        run: |
          cd artifacts\Release\x64
          del /q *.xml 2>nul
          del /q *.pdb 2>nul
          del /q *.config 2>nul

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llcom_x64
          path: artifacts/Release/x64/

      # -------- 以下步骤仅在打 tag 时执行 --------

      - name: Copy core_script into Release folder
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: |
          xcopy /e /r /y "llcom\DefaultFiles\core_script" "artifacts\Release\x64\core_script\"

      - name: Package zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path temp
          Copy-Item LICENSE artifacts\Release\x64\LICENSE.txt -Force
          Copy-Item CHANGES.md artifacts\Release\x64\CHANGES.md -Force
          Compress-Archive -Path artifacts\Release\x64\* -Force -DestinationPath temp\llcom-y.zip

      - name: Generate update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $base = "https://github.com/Eureka12138github/llcom-y/releases/download/$tag"
          $xml = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <item>
              <version>$version</version>
              <url>$base/llcom-y.zip</url>
              <changelog>https://github.com/Eureka12138github/llcom-y/releases/tag/$tag</changelog>
              <mandatory mode="1">false</mandatory>
          </item>
          "@
          Set-Content -Path temp/autoUpdate.xml -Value $xml -Encoding UTF8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LLCOM-Y ${{ github.ref_name }}
          body_path: CHANGES.md
          draft: false
          files: |
            temp/llcom-y.zip
            temp/autoUpdate.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build and Release

on:
  push:
    branches-ignore:
      - next
    tags:
      - '*'
    paths-ignore:
      - "community-scripts/**"
      - "docs/**"
      - "**/*.md"
      - ".github/**"
  pull_request:
    branches-ignore:
      - next
    paths-ignore:
      - "community-scripts/**"
      - "docs/**"
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，快速连续 push 时取消旧任务
concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限，默认 GITHUB_TOKEN 只读
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64
        run: dotnet build llcom/llcom.csproj -c Release -p:Platform=x64

      - name: Run unit tests (x64)
        run: dotnet test tests/llcom.Tests/llcom.Tests.csproj -c Release -p:Platform=x64

      - name: Build x86
        run: dotnet build llcom/llcom.csproj -c Release -p:Platform=x86

      - name: Clean build output
        shell: pwsh
        run: |
          foreach ($platform in @("x64", "x86")) {
            $dir = "artifacts/Release/$platform"
            Remove-Item "$dir/*.xml", "$dir/*.pdb", "$dir/*.config" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: llcom-y_x64
          path: artifacts/Release/x64/

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: llcom-y_x86
          path: artifacts/Release/x86/

      # -------- Release steps (tags only) --------

      - name: Prepare release packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          foreach ($platform in @("x64", "x86")) {
            $dir = "artifacts/Release/$platform"
            Copy-Item LICENSE "$dir/LICENSE.txt" -Force
            Copy-Item CHANGES.md "$dir/CHANGES.md" -Force

            $coreDest = "$dir/core_script"
            if (Test-Path $coreDest) { Remove-Item $coreDest -Recurse -Force }
            Copy-Item "llcom/DefaultFiles/core_script" $coreDest -Recurse -Force

            Compress-Archive -Path "$dir/*" -Force -DestinationPath "temp/llcom-y-$platform.zip"
          }

      - name: Generate update manifests
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $base = "https://github.com/Eureka12138github/llcom-y/releases/download/$tag"

          foreach ($platform in @("x64", "x86")) {
            $asset = "llcom-y-$platform.zip"
            $manifest = if ($platform -eq "x64") { "autoUpdate.xml" } else { "autoUpdate-x86.xml" }
            $lines = @(
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<item>',
              "    <version>$version</version>",
              "    <url>$base/$asset</url>",
              "    <changelog>https://github.com/Eureka12138github/llcom-y/releases/tag/$tag</changelog>",
              '    <mandatory mode="1">false</mandatory>',
              '</item>'
            )
            $xml = $lines -join "`r`n"
            Set-Content -Path "temp/$manifest" -Value $xml -Encoding UTF8
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LLCOM-Y ${{ github.ref_name }}
          body_path: CHANGES.md
          draft: false
          files: |
            temp/llcom-y-x64.zip
            temp/llcom-y-x86.zip
            temp/autoUpdate.xml
            temp/autoUpdate-x86.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
